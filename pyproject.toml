[project]
name = "cmdsheet"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "alien5516788", email = "93880176+alien5516788@users.noreply.github.com"},
]
dependencies = ["pywebview[qt]>=6.1", "pyqt6>=6.10.2", "sqlalchemy>=2.0.48"]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "python3 src/main.py"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
